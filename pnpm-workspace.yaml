packages:
  - packages/*
  - apps/*

saveExact: true

# Yeni yayınlanan sürümler 3 gün beklenir (ele geçirilmiş sürümler genelde bu sürede yakalanır).
minimumReleaseAge: 4320

# Daha önce trusted publisher/provenance ile yayınlanmış bir paketin güvencesi düşerse kurulum durur.
trustPolicy: no-downgrade

# Bağımlılıkların install script'leri çalışmaz; git hook'ları `prepare` script'i kurar.
allowBuilds:
  lefthook: false
  esbuild: false

# GHSA-g3hv-75wg-m249: minimatch < 11.0.1 kalıp büyütmesiyle DoS. Sadece eslint ve typescript-eslint
# üzerinden gelir (geliştirme). İkisi de 10.x istiyor ama yalnızca `Minimatch` ve `minimatch()`
# kullanıyor; 11'de kalkan API'lere dokunmuyorlar. Üst paketler 11'e geçince bu satır silinmeli.
overrides:
  "minimatch@<11.0.1": "^11.0.5"
