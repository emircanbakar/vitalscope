# Yerel geliştirme ve CI içindir. Şifreler gerçek değil; portlar sadece localhost'a açık.
name: vitalscope-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: vitalscope
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dev -d vitalscope]
      interval: 2s
      timeout: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    environment:
      CLICKHOUSE_DB: vitalscope
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      # Rol ve kullanıcıları migration'lar oluşturur.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - 127.0.0.1:8123:8123
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:8123/ping]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
  clickhouse-data:
