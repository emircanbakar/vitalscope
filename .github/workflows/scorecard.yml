name: Scorecard

# OpenSSF Scorecard: repo güvenlik pratiklerini puanlar. Sonuç Security sekmesine (code scanning) yüklenir
# ve `publish_results` ile api.scorecard.dev'e yayınlanır.
# Yayın için Scorecard'ın kuralları: workflow düzeyinde env/defaults ve yazma izni yok, `id-token: write`
# sadece bu işte, işte yalnızca onaylı action'lar (checkout, scorecard, upload-sarif).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  # Ruleset değişince de çalışır (Branch-Protection kontrolü).
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF'i code scanning'e yüklemek için
      id-token: write # sonucu api.scorecard.dev'e yayınlamak için
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
