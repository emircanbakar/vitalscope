name: Release

# main'e her push'ta:
# 1. `version`: bekleyen changeset varsa "chore(repo): version packages" PR'ını açar / günceller.
#    Changeset kalmadıysa npm'de henüz olmayan sürümleri bulur.
# 2. `publish`: yayınlanacak sürüm varsa `npm` ortamında (sadece main) trusted publishing (OIDC) ile yayınlar.
#    NPM_TOKEN yoktur. Yayının kontrol noktası sürüm PR'ının merge'üdür. Her pakete provenance eklenir:
#    npm sayfasında paketin hangi commit'ten ve hangi workflow çalışmasından üretildiği görünür.
#    Her sürüm için GitHub release'i açılır; SDK notuna dist dosyalarının SHA-384 özetleri ve script
#    etiketi için SRI değeri yazılır.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      unpublished: ${{ steps.check.outputs.unpublished }}
    steps:
      # Sürüm PR'ının dalı changesets/action tarafından GITHUB_TOKEN ile push edilir.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore(repo): version packages"
          pr-title: "chore(repo): version packages"
      - id: check
        if: steps.changesets.outputs.has-changesets == 'false'
        run: node scripts/release.ts check

  publish:
    needs: version
    if: needs.version.outputs.unpublished != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # GitHub release'i
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Yayından önce testler ve bütçeler bir kez daha; build sadece burada, CI'da yapılır.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @vitalscope/sdk size
      - run: node scripts/release.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Trusted publishing provenance'ı kendiliğinden ekler; açıkça istenince üretilemezse yayın durur.
          NPM_CONFIG_PROVENANCE: "true"
