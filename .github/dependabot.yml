# Haftalık ve gruplu; otomatik merge yok, lockfile farkı PR'da incelenir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm'deki `minimumReleaseAge` ile aynı süre: yeni sürümler 3 gün beklenir.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]
